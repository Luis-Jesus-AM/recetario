{% extends "base.html" %}

{% block contenido %}
<h1>Buscar recetas según el nivel de alcohol</h1>

<form action="{{ url_for('alcohol') }}" method="POST">
    <label>Máximo de alcohol (g):</label>
    <input type="number" name="max_alcohol" required>
    <button type="submit">Buscar</button>
</form>

{% endblock %}
